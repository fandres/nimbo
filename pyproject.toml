[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nimbo"
version = "0.5.0b1"
license = {file = "LICENSE"}
authors = [{name = "fandres323"}]
description = "Nimbo: catálogo, ventas y cobros para emprendedores"
requires-python = ">=3.11"
dependencies = ["PySide6>=6.8,<7"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "pytest-qt>=4.4,<5"]

[project.scripts]
nimbo = "mi_negocio.app:main"
mi-negocio = "mi_negocio.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
qt_api = "pyside6"
